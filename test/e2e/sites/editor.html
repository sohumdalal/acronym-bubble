<!doctype html>
<meta charset="utf-8" />
<title>Editor</title>
<!-- Places where a user types. The extension stays out of all of them. -->
<body style="font: 16px/1.5 Georgia, serif; margin: 24px">
  <p id="read">Read-only text about the REST API.</p>
  <div id="ce" contenteditable="true">Editable text about the REST API.</div>
  <textarea id="ta" style="width: 400px">A textarea about the REST API.</textarea>
  <input id="in" style="width: 400px" value="An input about the REST API." />
</body>
