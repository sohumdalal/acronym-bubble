<!doctype html>
<meta charset="utf-8" />
<title>App</title>
<!-- A single-page app: the view is replaced in place and the URL changes
     with pushState, with no page load in between. -->
<body style="font: 16px/1.5 Georgia, serif; margin: 24px">
  <nav><a href="#" id="go">Next page</a></nav>
  <main id="view"><p id="first">First view: the SDK uses the REST API.</p></main>
  <script>
    document.getElementById('go').addEventListener('click', (e) => {
      e.preventDefault();
      history.pushState({}, '', '/spa/next');
      document.getElementById('view').innerHTML = '<p id="second">Second view: deploys run through CI on every PR.</p>';
    });
  </script>
</body>
